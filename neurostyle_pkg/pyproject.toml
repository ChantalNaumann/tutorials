[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostyle"
version = "0.1.0"
description = "Matplotlib styles and helpers for neuroscience figures"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["neurostyle"]

[tool.setuptools.package-data]
neurostyle = ["styles/*.mplstyle"]
